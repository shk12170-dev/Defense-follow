# 규칙 R13(분산 로그인 실패, 비밀번호 스프레이)의 Sigma 상관(correlation) 표현.
# 한 계정(username)에 대한 로그인 실패가 10분 안에 서로 다른 IP 8개 이상에서 발생하면 탐지한다.
# value_count 상관은 서로 다른 값의 개수를 센다. 정확한 기준은 rules/rules.yaml의 R13(threshold_ips)이다.
title: Failed Login For Existing Account
id: 5c8e3a17-2b94-4d60-a1f3-7e9d6b0c4a13
name: defense_failed_login
status: experimental
description: 존재하는 계정에 대한 로그인 실패
author: Defense-follow
date: 2026-11-26
logsource:
  product: defense_follow
  service: audit
detection:
  selection:
    action: auth.login
    result: failed
  condition: selection
