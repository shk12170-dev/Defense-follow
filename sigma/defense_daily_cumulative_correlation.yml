  한 계정이 24시간 안에 50건 이상 조회를 40회 이상 수행 (R6 근사, 2단계 차단).
  저속으로 천천히 빼가는 내부자를 잡기 위한 규칙이며, 탐지 엔진은 계정을 자동 잠금한다.
author: Defense-follow
