# 규칙 R4(대량 조회 후 외부 반출)의 Sigma 상관(correlation) 표현.
# 주의: R4의 '직전 30분 조회 합계 200건 이상' 조건은 합계를 세야 하므로 근사했다.
# 한 번에 50건 이상 조회한 뒤 30분 안에 내보내기가 이어지면 탐지한다. 정확한 기준은 rules/rules.yaml의 R4가 기준이다.
title: Customer Page Read With 50 Or More Rows (Export Chain)
id: 7e1b4d93-6c28-4f05-91a8-3d5c2b7e6505
name: defense_customer_page_read_chain
status: experimental
description: 한 번의 요청으로 50건 이상의 고객 정보를 조회
author: Defense-follow
date: 2026-11-25
logsource:
  product: defense_follow
  service: audit
detection:
  selection:
    action: customer.list
    result: ok
    rows|gte: 50
  condition: selection
level: informational
