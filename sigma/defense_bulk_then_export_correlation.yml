title: Bulk Customer Read Followed By Export (Approximation Of R4)
id: 5b2d8e47-9f13-4a60-8c75-1e4a6c9d7707
status: experimental
description: 한 계정이 대량 조회 후 30분 안에 내보내기를 실행 (R4 근사)
author: Defense-follow
date: 2026-11-25
tags:
  - attack.exfiltration
  - attack.t1048
correlation:
  type: temporal_ordered
  rules:
    - defense_customer_page_read_chain
    - defense_customer_export
  group-by:
    - username
  timespan: 30m
falsepositives:
  - 업무상 정당한 대량 조회 후 보고용 내보내기
level: critical
