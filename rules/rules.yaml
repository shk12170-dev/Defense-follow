# 탐지 규칙 정의. 임계값은 이 파일에서 조정한다 (코드 수정 불필요).
# 시간대는 한국 표준시(UTC+9) 기준으로 판단한다.
utc_offset_hours: 9

# 서버 하드 쿼터: 데이터를 반환하기 전에 적용하는 건수 상한. 세 종류를 함께 적용하고 가장 빡빡한 것이 이긴다.
#  windows         : 모든 조회를 합친 기간별 한도. 24시간(합성 정상 업무 최대 1,202건), 7일(최대 6,118건) 위로 잡아 정상 업무를 막지 않는다.
#  profiles.*.limits: 조회 유형별 한도(상세·검색 / 목록 / 마스킹 해제)와 10분 같은 짧은 창. 한꺼번에 많이 가져가는 것을 제한한다.
#  stepup_penalty  : 재인증을 통과한 직후 한도를 줄인다(본인 인증 코드를 가진 내부자가 재인증만으로 한도를 되찾지 못하게).
# 프로필은 환경변수 DEFENSE_QUOTA_PROFILE 로 바꾼다. 측정 결과(오탐·유출)는 docs/benchmark.md 와 scripts/quota_study.py 참고.
#  standard: 합성 정상 업무에서 상담원이 목록을 하루 평균 457건(최대 880건) 넘겨 본다는 가정에서도 오탐이 거의 없는 기본값
#  strict  : 유출 상한을 크게 줄이지만 목록 열람이 잦은 업무에서는 정상 업무를 막는다. 목록 열람을 필터·검색 중심으로 바꾼 뒤 쓴다
quota:
  profile: standard
  windows:
    - hours: 24
      rows: {agent: 1500, admin: 2000}
    - hours: 168
      rows: {agent: 7000, admin: 8000}
  stepup_penalty: {hours: 24, factor: 0.5}
  profiles:
    standard:
      limits:
        - {name: "상세·검색", actions: [customer.view, customer.search], minutes: 10, rows: {agent: 100, admin: 100}}
        - {name: "상세·검색", actions: [customer.view, customer.search], minutes: 1440, rows: {agent: 500, admin: 500}}
        - {name: "목록", actions: [customer.list], minutes: 10, rows: {agent: 200, admin: 200}}
        - {name: "목록", actions: [customer.list], minutes: 1440, rows: {agent: 900, admin: 900}}
        - {name: "마스킹 해제", actions: [customer.unmask], minutes: 1440, rows: {admin: 20}}
    strict:
      windows:
        - hours: 24
          rows: {agent: 800, admin: 2000}
        - hours: 168
          rows: {agent: 3500, admin: 8000}
      limits:
        - {name: "상세·검색", actions: [customer.view, customer.search], minutes: 10, rows: {agent: 100, admin: 100}}
        - {name: "상세·검색", actions: [customer.view, customer.search], minutes: 1440, rows: {agent: 500, admin: 500}}
        - {name: "목록", actions: [customer.list], minutes: 10, rows: {agent: 100, admin: 100}}
        - {name: "목록", actions: [customer.list], minutes: 1440, rows: {agent: 300, admin: 300}}
        - {name: "마스킹 해제", actions: [customer.unmask], minutes: 1440, rows: {admin: 20}}

# 로그인 스로틀: 같은 (아이디, IP)에서 window_min 안에 max_failures_per_user_ip회 실패하거나 같은 IP에서 max_failures_per_ip회 실패하면
# 그 조합의 로그인을 window_min 동안 거부한다(HTTP 429). 계정 자체는 잠그지 않아, 공격자가 남의 계정을 잠가 업무를 막는 것을 피한다.
login_throttle:
  window_min: 10
  max_failures_per_user_ip: 5
  max_failures_per_ip: 20

# 고객정보 접근으로 간주하는 동작 (result=ok 인 것만 집계)
data_actions:
  - customer.list
  - customer.search
  - customer.view
  - customer.unmask
  - customer.export

rules:
  - id: R1
    name: 대량 조회
    description: 짧은 시간 안에 조회한 고객 건수 합계가 임계값을 넘음 (쿠팡형 내부자 대량 조회)
    type: volume
    window_min: 10
    threshold_rows: 300
    cooldown_min: 30
    severity: high
    response: stepup      # 먼저 재인증(TOTP+사유)을 요구하고, 24시간 안에 다시 발동하면 잠금 (잠금 오탐을 줄이기 위한 단계적 대응)
    escalate_min: 1440
    reset_on_stepup: true   # 재인증 후에는 새로 센다. 이후 다시 기준을 넘으면 잠금
    mitre: T1213

  - id: R2
    name: 비정상 시간대 접근
    description: 심야·새벽(00:00~05:59 KST)에 고객정보에 접근
    type: off_hours
    start_hour: 0
    end_hour: 6
    cooldown_min: 1440
    severity: medium
    mitre: T1078

  - id: R3
    name: 휴면·퇴사·잠금 계정 접근
    description: 비활성 상태 계정으로 로그인하거나 기존 토큰을 사용하려는 시도
    type: inactive_account
    actions: [auth.login, auth.token]
    results: [denied]
    detail_contains: ["status=dormant", "status=locked", "inactive account"]
    cooldown_min: 60
    severity: high
    mitre: T1078

  # ---- 2차 보완: 저속 공격 대응(누적 조회량, 단계적 대응)과 반출 사전 차단 ----
  - id: R5
    name: 일일 누적 조회 (경고)
    description: 하루(24시간) 누적 조회량이 많음. 저속으로 천천히 빼가는 공격 대응. 경고만 하고 계정은 잠그지 않음(1단계)
    type: volume
    window_min: 1440
    threshold_rows: 1200  # 1,000건이면 정상 업무 경고가 상담원·일의 21%로 너무 잦아 측정 후 상향 (docs/benchmark.md)
    cooldown_min: 1440
    severity: medium
    response: stepup      # 경고만 하던 1단계를 재인증 요구로 강화
    escalate: false       # 반복해도 잠그지 않는다 (잠금은 R6가 담당)
    mitre: T1213

  - id: R6
    name: 일일 누적 조회 (차단)
    description: 하루 누적 조회량이 위험 수준. 계정 자동 잠금(2단계)
    type: volume
    window_min: 1440
    threshold_rows: 2000
    cooldown_min: 1440
    severity: high
    mitre: T1213

  - id: R8
    name: 개인 기준선 대비 이상 조회량
    description: 오늘 누적 조회량이 본인의 과거 평균의 N배 이상이고 최소 건수를 넘음(UEBA). 고정 임계값 R5(1,200건)에 못 미치는 저속 유출을 잡는다. 경고만 하고 잠그지 않음
    type: baseline
    baseline_days: 14
    min_days: 3
    multiplier: 4
    min_rows: 500
    cooldown_min: 1440
    severity: medium
    response: stepup
    escalate: false
    mitre: T1213

  - id: R9
    name: 조회 한도 초과 시도
    description: 서버 하드 쿼터를 모두 소진한 뒤에도 조회·내보내기를 시도(저속 대량 수집의 마지막 단계). 이미 서버가 거부했으므로 경고하고 담당자 확인을 요청(lock false)
    type: event_match
    actions: [customer.list, customer.search, customer.view, customer.unmask, customer.export]
    results: [blocked]
    detail_contains: ["quota exceeded"]
    cooldown_min: 60
    severity: high
    lock: false
    mitre: T1213

  - id: R10
    name: 허니토큰 접근
    description: 정상 업무로는 열 일이 없는 미끼 고객 레코드(허니토큰)에 접근. 정상 업무와 겹치지 않으므로 전수 조회·ID 순차 조회의 거의 확실한 신호이며 계정을 즉시 잠근다
    type: event_match
    actions: [honeytoken.access]
    results: [ok]
    detail_contains: ["decoy"]
    cooldown_min: 60
    severity: critical
    mitre: T1119

  - id: R11
    name: 범위 밖 고객 조회 거부 반복
    description: 담당이 아닌 고객 조회 시도가 짧은 시간에 반복됨. 고객 ID를 순차로 넣어 보는 탐색(IDOR 스캔) 징후. 먼저 재인증을 요구하고 반복하면 잠금
    type: denied_burst
    window_min: 10
    threshold_count: 10
    cooldown_min: 60
    severity: high
    response: stepup
    escalate_min: 1440
    mitre: T1087

  - id: R12
    name: 로그인 실패 반복(스로틀)
    description: 같은 아이디·IP 조합의 로그인 실패가 반복되어 서버가 로그인을 일시 거부함(비밀번호 대입·계정 정보 재사용 징후). 계정은 잠그지 않고 경고
    type: event_match
    actions: [auth.login]
    results: [blocked]
    detail_contains: ["login throttle"]
    cooldown_min: 10
    severity: medium
    lock: false
    mitre: T1110

  - id: R13
    name: 분산 로그인 실패(비밀번호 스프레이)
    description: 한 계정의 로그인 실패가 짧은 시간에 서로 다른 여러 IP에서 발생. IP마다 시도가 적어 (아이디, IP) 스로틀(R12)을 피하는 분산 대입 징후. 계정은 잠그지 않고 재인증을 요구해, 비밀번호가 뚫려도 인증 코드(TOTP) 없이는 데이터에 접근할 수 없게 한다
    type: login_spray
    window_min: 10
    threshold_ips: 8
    cooldown_min: 30
    severity: high
    response: stepup
    escalate: false
    mitre: T1110

  - id: R14
    name: 다중 IP 동시 사용(토큰 탈취·계정 공유)
    description: 한 계정의 고객정보 조회가 짧은 시간에 서로 다른 IP 2개 이상에서 발생. 훔친 로그인 토큰을 다른 곳에서 쓰거나 계정을 공유하는 징후. 정상 사용자의 네트워크 전환과 구분이 어려워 잠그지 않고 재인증(TOTP)을 요구한다. 토큰만 가진 공격자는 인증 코드가 없어 막힌다
    type: multi_ip_session
    window_min: 10
    threshold_ips: 2
    cooldown_min: 30
    severity: high
    response: stepup
    stepup_scope: foreign_ip
    escalate: false
    mitre: T1550

  - id: R7
    name: 대량 조회 직후 내보내기 차단
    description: 대량 조회 직후의 내보내기를 서버가 사전에 거부한 사건. 반출은 막고, 계정은 잠그지 않은 채 보안 담당자 확인을 요청(lock false)
    type: event_match
    actions: [customer.export]
    results: [blocked]
    detail_contains: ["pre-block"]
    cooldown_min: 60
    severity: critical
    lock: false
    mitre: T1048

  - id: R4
    name: 대량 조회 후 외부 전송
    description: 대량 조회 직후 내보내기를 실행 (롯데카드형 정보 반출 징후)
    type: bulk_then_export
    export_action: customer.export
    lookback_min: 30
    min_rows: 200
    cooldown_min: 60
    severity: critical
    mitre: T1048
