# 탐지 규칙 정의. 임계값은 이 파일에서 조정한다 (코드 수정 불필요).
# 시간대는 한국 표준시(UTC+9) 기준으로 판단한다.
utc_offset_hours: 9

# 고객정보 접근으로 간주하는 동작 (result=ok 인 것만 집계)
data_actions:
  - customer.list
  - customer.search
  - customer.view
  - customer.unmask
  - customer.export

rules:
  - id: R1
    name: 대량 조회
    description: 짧은 시간 안에 조회한 고객 건수 합계가 임계값을 넘음 (쿠팡형 내부자 대량 조회)
    type: volume
    window_min: 10
    threshold_rows: 300
    cooldown_min: 30
    severity: high
    mitre: T1213

  - id: R2
    name: 비정상 시간대 접근
    description: 심야·새벽(00:00~05:59 KST)에 고객정보에 접근
    type: off_hours
    start_hour: 0
    end_hour: 6
    cooldown_min: 1440
    severity: medium
    mitre: T1078

  - id: R3
    name: 휴면·퇴사·잠금 계정 접근
    description: 비활성 상태 계정으로 로그인하거나 기존 토큰을 사용하려는 시도
    type: inactive_account
    actions: [auth.login, auth.token]
    results: [denied]
    detail_contains: ["status=dormant", "status=locked", "inactive account"]
    cooldown_min: 60
    severity: high
    mitre: T1078

  # ---- 2차 보완: 저속 공격 대응(누적 조회량, 단계적 대응)과 반출 사전 차단 ----
  - id: R5
    name: 일일 누적 조회 (경고)
    description: 하루(24시간) 누적 조회량이 많음. 저속으로 천천히 빼가는 공격 대응. 경고만 하고 계정은 잠그지 않음(1단계)
    type: volume
    window_min: 1440
    threshold_rows: 1200  # 1,000건이면 정상 업무 경고가 상담원·일의 21%로 너무 잦아 측정 후 상향 (docs/benchmark.md)
    cooldown_min: 1440
    severity: medium
    mitre: T1213

  - id: R6
    name: 일일 누적 조회 (차단)
    description: 하루 누적 조회량이 위험 수준. 계정 자동 잠금(2단계)
    type: volume
    window_min: 1440
    threshold_rows: 2000
    cooldown_min: 1440
    severity: high
    mitre: T1213

  - id: R7
    name: 대량 조회 직후 내보내기 차단
    description: 대량 조회 직후의 내보내기를 서버가 사전에 거부한 사건. 반출은 막고, 계정은 잠그지 않은 채 보안 담당자 확인을 요청(lock false)
    type: event_match
    actions: [customer.export]
    results: [blocked]
    detail_contains: ["pre-block"]
    cooldown_min: 60
    severity: critical
    lock: false
    mitre: T1048

  - id: R4
    name: 대량 조회 후 외부 전송
    description: 대량 조회 직후 내보내기를 실행 (롯데카드형 정보 반출 징후)
    type: bulk_then_export
    export_action: customer.export
    lookback_min: 30
    min_rows: 200
    cooldown_min: 60
    severity: critical
    mitre: T1048
